<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <div class="nav-logo">
                <span>Nome Restaurante</span>
            </div>

            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Menu</a></li>
                <li><a href="#">Serviços</a></li>
                <li><a href="#">Ofertas</a></li>
            </ul>

            <div class="nav-actions">
                <button class="nav-icon" aria-label="Buscar">
                    <img src="" alt="Busca">
                </button>
                <button class="nav-icon nav-cart" aria-label="Carrinho">
                    <img src="" alt="Carrinho">
                    <span class="nav-badge">8</span>
                </button>
                <button class="nav-cta">Contato</button>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero">

            
            <div class="hero-left">
                <h1>Título principal do restaurante</h1>
                <p>Subtítulo descrevendo o restaurante.</p>

                <div class="hero-buttons">
                    <button class="btn btn-primary">Pedir Agora</button>
                    
                </div>
            </div>

            
            <div class="hero-right">

                <div class="hero-image">
                    <img src="" alt="Foto do restaurante">
                </div>

                
                <div class="hero-card hero-card-left">
                    <img src="" alt="Foto do prato">
                    <div class="hero-card-info">
                        <p class="card-name">Spicy Noodles</p>
                        <div class="card-stars"></div>
                        <p class="card-price">R$ 18,00</p>
                    </div>
                </div>

                <div class="hero-card hero-card-right">
                    <img src="" alt="Foto do prato">
                    <div class="hero-card-info">
                        <p class="card-name">Vegetarian Salad</p>
                        <div class="card-stars"></div>
                        <p class="card-price">R$ 23,00</p>
                    </div>
                </div>

            </div>

        </section>

        <section class="menu">
            <div class="container">
                <!-- Todo conteudo vai ficar aqui dentro... -->
            </div>
        </section>

         <section class="ofertas">
            <div class="container">
                <!-- Todo conteudo vai ficar aqui dentro... -->
            </div>
        </section>

         <section class="servicos">
            <div class="container">
                <!-- Todo conteudo vai ficar aqui dentro... -->
            </div>
        </section>


    </main>

    <footer>
        <div class="container"></div>
    </footer>

</body>
</html>
